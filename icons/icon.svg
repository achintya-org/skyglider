<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1424"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ddcff"/>
      <stop offset="1" stop-color="#8b8bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#5ad1ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5ad1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#bfe6ff">
    <circle cx="96"  cy="120" r="3"   opacity="0.8"/>
    <circle cx="150" cy="86"  r="2"   opacity="0.6"/>
    <circle cx="410" cy="104" r="3"   opacity="0.7"/>
    <circle cx="360" cy="150" r="2"   opacity="0.5"/>
    <circle cx="440" cy="190" r="2.4" opacity="0.6"/>
    <circle cx="78"  cy="210" r="2"   opacity="0.5"/>
  </g>

  <!-- night skyline -->
  <g>
    <rect x="40"  y="384" width="46" height="74"  rx="4" fill="#121a2c"/>
    <rect x="92"  y="350" width="40" height="108" rx="4" fill="#0f1727"/>
    <rect x="150" y="372" width="34" height="86"        fill="#131c30"/>
    <rect x="330" y="360" width="40" height="98"  rx="4" fill="#0f1727"/>
    <rect x="376" y="338" width="52" height="120" rx="4" fill="#131c30"/>
    <rect x="430" y="378" width="42" height="80"  rx="4" fill="#0f1727"/>
    <g fill="#5ad1ff" opacity="0.85">
      <rect x="104" y="368" width="6" height="6"/>
      <rect x="116" y="368" width="6" height="6"/>
      <rect x="104" y="386" width="6" height="6"/>
      <rect x="392" y="356" width="6" height="6"/>
      <rect x="404" y="356" width="6" height="6"/>
      <rect x="392" y="374" width="6" height="6"/>
      <rect x="404" y="374" width="6" height="6"/>
    </g>
  </g>

  <!-- motion trail -->
  <path d="M 92 372 Q 150 300 214 258" fill="none" stroke="#5ad1ff" stroke-opacity="0.28" stroke-width="12" stroke-linecap="round"/>

  <!-- glider (paraglider) -->
  <g transform="rotate(-9 256 220)">
    <path d="M 168 176 Q 256 112 344 176" fill="none" stroke="url(#wing)" stroke-width="30" stroke-linecap="round"/>
    <g stroke="#cfe8ff" stroke-opacity="0.85" stroke-width="4">
      <line x1="182" y1="186" x2="246" y2="262"/>
      <line x1="330" y1="186" x2="268" y2="262"/>
    </g>
    <rect x="243" y="250" width="28" height="44" rx="14" fill="#eaf6ff"/>
  </g>
</svg>
