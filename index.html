<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="description" content="Sky Glider — a fast, installable PWA flying game playable offline. Tap, click or press space to fly through the gaps." />
  <title>Sky Glider</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="480" height="720" aria-label="Sky Glider game canvas"></canvas>

    <div id="hud">
      <div id="score">0</div>
    </div>

    <div id="overlay" class="screen">
      <h1>Sky&nbsp;Glider</h1>
      <p class="tagline">Fly through the gaps. Don't crash.</p>
      <button id="start-btn" class="btn">Play</button>
      <p class="hint">Tap &middot; Click &middot; Space</p>
      <p class="best">Best: <span id="best-start">0</span></p>
    </div>

    <div id="gameover" class="screen hidden">
      <h2>Game Over</h2>
      <p class="final">Score <span id="final-score">0</span></p>
      <p class="best">Best: <span id="final-best">0</span></p>
      <button id="restart-btn" class="btn">Play Again</button>
      <p class="hint">Tap &middot; Click &middot; Space</p>
    </div>
  </div>

  <p id="install-tip" class="hidden">📲 Install Sky Glider for offline play <button id="install-btn" class="btn-sm">Install</button></p>

  <script src="./game.js"></script>
</body>
</html>
