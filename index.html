<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1a" />
  <meta name="description" content="Sky Glider — a calm, professional 3D free-flight experience with real physics." />
  <title>Sky Glider</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=ff1" />
</head>
<body>
  <canvas id="renderCanvas" touch-action="none"></canvas>

  <!-- Heads-up display -->
  <div id="hud" class="hidden">
    <button id="pause-btn" aria-label="Pause">⏸</button>
    <div id="dot"></div>
    <div id="readout">
      <div class="stat mode-stat"><span class="num" id="mode">ON FOOT</span></div>
      <div class="divider"></div>
      <div class="stat"><span class="num" id="speed">0</span><span class="lbl">km/h</span></div>
      <div class="divider"></div>
      <div class="stat"><span class="num" id="alt">0</span><span class="lbl">m altitude</span></div>
      <div class="divider"></div>
      <div class="stat boost">
        <span class="lbl">boost</span>
        <div id="boost-bar"><div id="boost-fill"></div></div>
      </div>
    </div>
  </div>

  <!-- Touch controls -->
  <div id="touch" class="hidden">
    <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
    <div id="touch-buttons">
      <button id="btn-down" class="tbtn">FLY</button>
      <button id="btn-boost" class="tbtn">BOOST</button>
      <button id="btn-up" class="tbtn">JUMP</button>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading" class="screen">
    <div class="spinner"></div>
    <p class="muted">Preparing the sky…</p>
  </div>

  <!-- Menu -->
  <div id="menu" class="screen hidden">
    <div class="panel">
      <div class="wordmark">SKY&nbsp;GLIDER</div>
      <p class="sub">Open city · walk or fly anywhere</p>
      <button id="play-btn" class="btn">Enter the City</button>
      <div class="help">
        <div><kbd>F</kbd><span>Walk / Fly</span></div>
        <div><kbd>Mouse</kbd><span>Look (on foot)</span></div>
        <div><kbd>WASD</kbd><kbd>↑↓←→</kbd><span>Move &amp; steer flight</span></div>
        <div><kbd>Shift</kbd><span>Sprint / Boost</span></div>
        <div><kbd>Space</kbd><span>Jump / Boost</span></div>
        <div><kbd>Esc</kbd><span>Pause</span></div>
      </div>
    </div>
  </div>

  <!-- Pause -->
  <div id="pause" class="screen hidden">
    <div class="panel">
      <div class="wordmark small">PAUSED</div>
      <button id="resume-btn" class="btn">Resume</button>
      <button id="menu-btn" class="btn ghost">Main Menu</button>
    </div>
  </div>

  <p id="err" class="hidden"></p>

  <script src="./vendor/babylon.js?v=ff1"></script>
  <script src="./vendor/HavokPhysics_umd.js?v=ff1"></script>
  <script src="./game.js?v=ff1"></script>
</body>
</html>
