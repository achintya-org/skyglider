name: Firebase setup

# Provisions the multiplayer backend using the org secret FIREBASE_TOKEN.
# Triggered by editing .github/firebase-trigger.txt (push-based, so it works
# on this feature branch). Line 1 = mode (probe|provision), line 2 = project id.
on:
  push:
    branches: ["claude/move-into-org-one-712g89"]
    paths: [".github/firebase-trigger.txt"]

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i -g firebase-tools

      - name: Read trigger
        id: t
        run: |
          MODE=$(sed -n '1p' .github/firebase-trigger.txt | tr -d '[:space:]')
          PID=$(sed -n '2p' .github/firebase-trigger.txt | tr -d '[:space:]')
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "pid=$PID" >> "$GITHUB_OUTPUT"
          echo "MODE=$MODE  PID=$PID"

      - name: Auth check
        run: |
          echo "token length: ${#FIREBASE_TOKEN}"
          firebase --version
          echo "=== projects:list ==="
          firebase projects:list --json > projects.json 2> list.err || { echo "LIST_FAILED"; cat list.err; }
          cat projects.json 2>/dev/null || true

      - name: Provision
        if: steps.t.outputs.mode == 'provision'
        run: |
          set +e
          PID="${{ steps.t.outputs.pid }}"
          if [ -z "$PID" ]; then PID="skyglider-$(openssl rand -hex 4)"; fi
          echo "Using project id: $PID"
          echo "=== create project (ok if exists) ==="
          firebase projects:create "$PID" --display-name "Sky Glider" --json; echo
          echo "=== create Realtime Database instance ==="
          firebase database:instances:create "${PID}-default" --project "$PID" --location us-central1 --json; echo
          echo "=== create web app ==="
          firebase apps:create WEB "Sky Glider Web" --project "$PID" --json > app.json; cat app.json; echo
          APPID=$(node -e "try{const j=require('./app.json');const f=JSON.stringify(j);const m=f.match(/1:[0-9]+:web:[0-9a-z]+/i);process.stdout.write(m?m[0]:'')}catch(e){}")
          echo "APPID=$APPID"
          echo "=== sdk config ==="
          firebase apps:sdkconfig WEB "$APPID" --project "$PID" --json > sdk.json
          echo "=====CONFIG_START====="
          cat sdk.json
          echo "=====CONFIG_END====="
          echo "=== deploy database rules ==="
          firebase deploy --only database --project "$PID" --non-interactive
