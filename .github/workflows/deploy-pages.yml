name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/move-into-org-one-712g89"]
  workflow_dispatch:

# Allow the workflow token to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Ensure the github-pages environment permits this branch to deploy.
  # (GitHub may restrict the auto-created environment to the default branch.)
  # Non-blocking: Pages is already configured from prior runs; if PAT_TOKEN is
  # unavailable the curl returns 401 but the deploy job runs anyway.
  prepare-env:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Allow all branches to deploy to github-pages
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/env.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/environments/github-pages" \
            -d '{"deployment_branch_policy":null}')
          echo "PUT environments/github-pages -> HTTP $code"
          cat /tmp/env.json
          test "$code" = "200" || test "$code" = "201" || echo "Warning: could not update env (already configured or PAT missing)"

  deploy:
    needs: prepare-env
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
